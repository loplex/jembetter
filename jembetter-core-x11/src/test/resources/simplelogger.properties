# Test-only SLF4J binding config. Default threshold is WARN so the benign
# X11 protocol errors that racy tests incidentally trigger (see
# WindowDeathWatcherTest's BadWindow comment) stay off the console; only
# X11ErrorHandler itself is raised back to DEBUG, since
# X11ErrorHandlerTest deliberately provokes one and asserts it was logged.
# Downstream consumers of jembetter-core-x11 supply their own binding/level -
# this file has no effect outside this module's test classpath.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.cz.loplex.jembetter.core.x11.X11ErrorHandler=debug
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
