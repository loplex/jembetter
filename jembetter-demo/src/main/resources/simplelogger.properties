# Default SLF4J binding for the runnable demos (mvn exec:java@host / @client
# / @host-facade). Keeps X11ErrorHandler's DEBUG log visible on stderr by
# default, matching the old unconditional System.err.println behavior.
org.slf4j.simpleLogger.defaultLogLevel=debug
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
