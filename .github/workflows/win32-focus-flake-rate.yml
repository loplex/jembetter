name: Win32 focus flake rate

# TEMPORARY DIAGNOSTIC - do not merge into main or develop.
#
# Measures how often the Win32 suite flakes on a GitHub-hosted Windows runner,
# by repeating the exact windows-ci.yml invocation and tallying which tests
# fail in which iteration.
#
# History, because it explains the shape:
#
# - win32-focus-isolation-probe.yml asked whether
#   EmbedSocketWin32Test.aFocusRequestMarkerByteFromTheClientFocusesTheEmbeddedWindow
#   fails because earlier tests in a shared Surefire fork leave focus state
#   behind. It came back inconclusive - its control variant passed, so the
#   isolation variants had nothing to differ from.
# - The first run of this workflow then passed that test in 6 baseline
#   iterations and ~4 fork-per-class ones. Against the single failure ever
#   observed, the isolation hypothesis has nothing to stand on, so the
#   -DreuseForks=false variant is gone: it cost 90 minutes and could only ever
#   confirm a hypothesis already out of evidence.
# - That run did surface a different, fully explained race, in
#   Win32FocusWatcherTest.unwatchStopsFurtherCallbacks (1 of 6). Hence the
#   change of purpose: rather than testing one hypothesis about one test, tally
#   whatever fails, so the actual flake profile becomes visible.
#
# Iteration count is high because the samples are nearly free: only the first
# iteration compiles, so the rest run in roughly 20 s each, not the 4+ minutes
# a cold windows-ci job takes.
#
# Per iteration it records the exit code, wall-clock duration, the two
# jembetter-host Win32 classes' elapsed times, and every test reported as
# failed. The timings are worth having: the one red CI run took 17.89 s /
# 11.80 s on those classes against 3.7-6.4 s whenever they passed, so failures
# clustering in slow iterations point at load sensitivity rather than at a
# defect.
#
# A hung fork is capped rather than allowed to consume the run - see the
# surefire.timeout note in the loop. Note the arithmetic: enough consecutive
# hangs still exhaust the job's own timeout-minutes, which is fine, because
# hanging every iteration is itself the answer and shows up in the first few.
#
# Deliberately keeps Maven's default fail-fast rather than --fail-at-end. An
# iteration that stops at the first failing module matches how windows-ci
# fails, and letting the reactor run on into jembetter-client would exercise
# EmbedPlugWin32Test - which has a known hang, so far only diagnosed under
# Wine - for the first time on real Windows, inside a loop. Note the
# consequence when reading results: once a module fails, later modules'
# tests did not run in that iteration, so their absence is not a pass.
on:
  push:
    branches: [spike_win32]
  workflow_dispatch:
    inputs:
      iterations:
        description: Iterations
        required: false
        default: "30"

jobs:
  flake-rate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Repeat mvn test and tally
        id: tally
        run: |
          # GitHub's pwsh wrapper sets $ErrorActionPreference='Stop' and appends
          # `exit $LASTEXITCODE`. Both are wrong for a tallying loop: a failing
          # iteration is the data, not an error, and on pwsh 7.3+ merging a
          # native command's stderr under Stop can abort the step outright.
          $ErrorActionPreference = 'Continue'
          if (Test-Path variable:\PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          $iterations = [int]("${{ github.event.inputs.iterations }}" -replace '^$', '30')
          $classes = @(
            'cz.loplex.jembetter.host.EmbedHostWin32Test',
            'cz.loplex.jembetter.host.EmbedSocketWin32Test'
          )

          New-Item -ItemType Directory -Force -Path logs | Out-Null
          $rows = @()
          $failed = 0
          $tally = @{}

          for ($i = 1; $i -le $iterations; $i++) {
            Write-Host "::group::iteration $i of $iterations"
            $log = "logs/iteration-$i.log"

            $started = Get-Date
            # surefire.timeout (forkedProcessTimeoutInSeconds) kills a fork that
            # stops making progress and records it as a failure, so one hang
            # costs a single iteration instead of the whole measurement. That
            # matters here specifically: EmbedPlugWin32Test is on record as
            # hanging indefinitely from a race that was never root-caused, and
            # 30 iterations give it far more chances than the 6 it survived.
            # 120 s is generous against a healthy iteration's ~20 s total while
            # still letting several hangs be observed inside the job's cap.
            #
            # Splatted from an array, not written inline: passed as a bare
            # token, PowerShell splits -Dsurefire.timeout=120 at the dot and
            # Maven receives "-Dsurefire" plus ".timeout=120", which it rejects
            # as an unknown lifecycle phase. That failed all 30 iterations in
            # under two minutes without a single test running. Array elements
            # are passed through verbatim.
            $mvnArgs = @('-B', 'test', '-Dsurefire.timeout=120')
            & mvn @mvnArgs 2>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            $seconds = [math]::Round(((Get-Date) - $started).TotalSeconds)
            if ($code -ne 0) { $failed++ }

            $row = [ordered]@{ iteration = $i; exit = $code; seconds = $seconds }
            foreach ($c in $classes) {
              $short = $c.Split('.')[-1]
              $line = Select-String -Path $log -Pattern ([regex]::Escape("-- in $c")) |
                        Select-Object -Last 1
              if ($line) {
                $t = [regex]::Match($line.Line, 'Time elapsed:\s*([0-9.]+)').Groups[1].Value
                $f = [regex]::Match($line.Line, 'Failures:\s*(\d+)').Groups[1].Value
                $e = [regex]::Match($line.Line, 'Errors:\s*(\d+)').Groups[1].Value
                $row[$short] = "F=$f E=$e ${t}s"
              } else {
                # Not a pass: fail-fast means an earlier module stopped the run.
                $row[$short] = "not reached"
              }
            }

            # Surefire's end-of-run summary lists each failure as
            # "[ERROR]   SomeTest.someMethod:123 message".
            # Unanchored on purpose: anchoring at line start would silently
            # report "no failures" if anything ever prefixes the captured
            # output, and a false clean result is the worst failure mode a
            # flake tally can have.
            $names = Select-String -Path $log -Pattern '\[ERROR\]\s+(\w+Test\.\w+)' |
                       ForEach-Object { $_.Matches[0].Groups[1].Value } |
                       Sort-Object -Unique
            # A killed fork reports "There was a timeout in the fork" and names
            # no test, so without this a hung iteration would show a failing
            # exit code beside an empty failure list - precisely the blank the
            # timeout was added to capture.
            if (Select-String -Path $log -Pattern 'There was a timeout in the fork' -Quiet) {
              $names = @($names) + '<fork timeout>' | Where-Object { $_ }
            }
            # A failing iteration in which no test ran at all means Maven itself
            # did not get going - a bad argument, a broken workspace. Saying so
            # separates it from "tests ran and passed", which is what an empty
            # failure list would otherwise be read as.
            if ($code -ne 0 -and -not (Select-String -Path $log -Pattern 'Tests run:' -Quiet)) {
              $names = @($names) + '<no tests ran>' | Where-Object { $_ }
            }
            foreach ($n in $names) { $tally[$n] = 1 + $(if ($tally.ContainsKey($n)) { $tally[$n] } else { 0 }) }
            $row['failedTests'] = $(if ($names) { $names -join ', ' } else { '-' })
            $rows += [pscustomobject]$row

            Write-Host "::endgroup::"
            Write-Host "iteration $i => exit $code, ${seconds}s, failed: $($row['failedTests'])"
          }

          $summary = @()
          $summary += "## $failed of $iterations iterations failed"
          $summary += ""
          if ($tally.Count -gt 0) {
            $summary += "### Flake rate per test"
            $summary += ""
            $summary += '| test | failed in |'
            $summary += '| --- | --- |'
            foreach ($k in ($tally.Keys | Sort-Object { -$tally[$_] })) {
              $summary += "| $k | $($tally[$k]) of $iterations |"
            }
            $summary += ""
          }
          $summary += "### Per iteration"
          $summary += ""
          $cols = $rows[0].PSObject.Properties.Name
          $summary += '| ' + ($cols -join ' | ') + ' |'
          $summary += '| ' + (($cols | ForEach-Object { '---' }) -join ' | ') + ' |'
          foreach ($r in $rows) {
            $summary += '| ' + (($cols | ForEach-Object { $r.$_ }) -join ' | ') + ' |'
          }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $summary | ForEach-Object { Write-Host $_ }

          "failed=$failed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "iterations=$iterations" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          # The tally IS the result, so a red iteration must not redden the step -
          # read the tables above. An infrastructure failure still shows up there,
          # as iterations whose classes read "not reached".
          exit 0

      - name: Upload iteration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration-logs
          path: logs/
          if-no-files-found: warn
