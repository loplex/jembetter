name: Win32 focus flake rate

# TEMPORARY DIAGNOSTIC - do not merge into main or develop.
#
# Follow-up to win32-focus-isolation-probe.yml, which came back inconclusive:
# its control variant (the jembetter-host module as-is) passed, so the
# isolation variants had nothing to differ from. Two reasons that probe could
# not answer the question, both addressed here.
#
# 1. It narrowed the context. It ran `mvn test -pl jembetter-host`, while the
#    one observed failure came from a full-reactor `mvn -B test`, where
#    jembetter-core-win32's 21 window-creating tests run in the same job
#    first. This workflow uses the exact windows-ci.yml invocation instead, so
#    whatever the reactor contributes is present.
#
# 2. It took one sample per variant. The failure has been seen exactly once
#    (of three Windows CI runs, only one got past jembetter-core-x11), so a
#    single green run distinguishes nothing. Each variant here repeats.
#
# What comes back per iteration: exit code, and for both Win32 classes the
# Tests-run line with its failure count and elapsed time. The timings matter -
# in the red run those classes took 17.89 s / 11.80 s against 5.65 s / 6.03 s
# in the probe, so if failures cluster in the slow iterations, that points at a
# timing-sensitive race rather than at leftover state.
#
# Reading the result:
#   baseline red sometimes, fresh-forks always green => isolation confirmed,
#     fix belongs in test isolation
#   both red at a similar rate                       => a flake independent of
#     fork reuse; correlate with the elapsed times before touching Win32Focus
#   both always green over this many runs             => the single red run was
#     an outlier of conditions not reproduced here; say so and stop chasing it
#
# Deliberately keeps Maven's default fail-fast rather than --fail-at-end: an
# iteration that stops at jembetter-host matches the red run's shape, and
# letting the reactor continue into jembetter-client would run
# EmbedPlugWin32Test - which has a known hang, so far only diagnosed under
# Wine - for the first time on real Windows, inside a loop. timeout-minutes
# below is the backstop either way.
on:
  push:
    branches: [spike_win32]
  workflow_dispatch:
    inputs:
      iterations:
        description: Iterations per variant
        required: false
        default: "6"

jobs:
  flake-rate:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: baseline
            extra: ""
          - id: fresh-fork-per-class
            extra: "-DreuseForks=false"
    name: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Repeat mvn test and tally
        id: tally
        run: |
          # GitHub's pwsh wrapper sets $ErrorActionPreference='Stop' and appends
          # `exit $LASTEXITCODE`. Both are wrong for a tallying loop: a failing
          # iteration is the data, not an error, and on pwsh 7.3+ merging a
          # native command's stderr under Stop can abort the step outright.
          $ErrorActionPreference = 'Continue'
          if (Test-Path variable:\PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          $iterations = [int]("${{ github.event.inputs.iterations }}" -replace '^$', '6')
          $extra = "${{ matrix.extra }}"
          $classes = @(
            'cz.loplex.jembetter.host.EmbedHostWin32Test',
            'cz.loplex.jembetter.host.EmbedSocketWin32Test'
          )

          New-Item -ItemType Directory -Force -Path logs | Out-Null
          $rows = @()
          $failed = 0

          for ($i = 1; $i -le $iterations; $i++) {
            Write-Host "::group::iteration $i of $iterations"
            $log = "logs/iteration-$i.log"

            $mvnArgs = @('-B', 'test')
            if ($extra -ne '') { $mvnArgs += $extra }
            & mvn @mvnArgs 2>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            if ($code -ne 0) { $failed++ }

            $row = [ordered]@{ iteration = $i; exit = $code }
            foreach ($c in $classes) {
              $short = $c.Split('.')[-1]
              $line = Select-String -Path $log -Pattern ([regex]::Escape("-- in $c")) |
                        Select-Object -Last 1
              if ($line) {
                $t = [regex]::Match($line.Line, 'Time elapsed:\s*([0-9.]+)').Groups[1].Value
                $f = [regex]::Match($line.Line, 'Failures:\s*(\d+)').Groups[1].Value
                $e = [regex]::Match($line.Line, 'Errors:\s*(\d+)').Groups[1].Value
                $row[$short] = "F=$f E=$e ${t}s"
              } else {
                $row[$short] = "did not run"
              }
            }
            $focus = Select-String -Path $log -Pattern 'never focused after the client wrote'
            $row['focusTestFailed'] = [bool]$focus
            $rows += [pscustomobject]$row

            Write-Host "::endgroup::"
            Write-Host "iteration $i => exit $code, focus test failed: $([bool]$focus)"
          }

          $summary = @()
          $summary += "## ${{ matrix.id }}: $failed of $iterations iterations failed"
          $summary += ""
          $cols = $rows[0].PSObject.Properties.Name
          $summary += '| ' + ($cols -join ' | ') + ' |'
          $summary += '| ' + (($cols | ForEach-Object { '---' }) -join ' | ') + ' |'
          foreach ($r in $rows) {
            $summary += '| ' + (($cols | ForEach-Object { $r.$_ }) -join ' | ') + ' |'
          }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $summary | ForEach-Object { Write-Host $_ }

          "failed=$failed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "iterations=$iterations" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          # The tally IS the result, so a red iteration must not redden the step -
          # read the table above. An infrastructure failure still shows up there,
          # as rows whose classes read "did not run".
          exit 0

      - name: Upload iteration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration-logs-${{ matrix.id }}
          path: logs/
          if-no-files-found: warn
